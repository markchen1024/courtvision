<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>courtvision — viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ── Header ──────────────────────────────────────────────────────────────── */
header { border-bottom: 1px solid var(--line-soft); }
header .bar {
  display: flex; align-items: center; gap: 20px;
  max-width: var(--shell); margin: 0 auto;
  padding: 20px 32px;
}

.live {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--signal-line); border-radius: 999px;
  padding: 4px 11px 4px 9px;
  font: 500 11px/1 var(--font-mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--signal);
}
.live i {
  width: 6px; height: 6px; border-radius: 50%; background: var(--signal);
  animation: pulse 2s var(--ease) infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

.scoreboard { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.scoreboard .side { display: flex; align-items: center; gap: 9px; }
.scoreboard .num { font: 500 30px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.scoreboard .home .num { color: var(--signal); }
.scoreboard .away .num { color: var(--teal); }
.scoreboard .sep { width: 1px; height: 26px; background: var(--line); }
.scoreboard .clock { font: 400 13px/1 var(--font-mono); color: var(--subtle); min-width: 44px; text-align: right; }

/* ── Layout ──────────────────────────────────────────────────────────────── */
main { padding: 24px 32px 40px; display: grid; gap: 20px; max-width: var(--shell); margin: 0 auto; }
.row-top { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
.row-bottom { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; }
@media (max-width: 1080px) { .row-top, .row-bottom { grid-template-columns: 1fr; } }

/* ── Footage ─────────────────────────────────────────────────────────────── */
.stage { position: relative; background: var(--surface-inset); aspect-ratio: 16/9; }
.stage video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
.stage .placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--subtle); text-align: center;
}
.stage .placeholder .big { font: 500 15px/1.4 var(--font-display); color: var(--muted); }

/* ── Court ───────────────────────────────────────────────────────────────── */
/* Fills whatever height the row ends up at, so it never leaves a dead band
   under the drawing when the footage panel is taller. */
canvas { flex: 1; min-height: 320px; width: 100%; display: block; background: var(--surface-inset); }

/* ── Box score ───────────────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 8px; text-align: right; }
th {
  font: 500 10px/1.4 var(--font-mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--subtle);
  border-bottom: 1px solid var(--line);
}
th:first-child, td:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid var(--line-soft); }
tbody tr:last-child { border-bottom: 0; }
td { font: 400 13px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
td.name { font-family: var(--font-sans); color: var(--foreground); }
td.pts { color: var(--foreground); font-weight: 500; }
.jersey {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 20px; padding: 0 5px; margin-right: 10px;
  border-radius: 4px; font: 500 11px/1 var(--font-mono); color: var(--inverse);
}

/* ── Play by play ────────────────────────────────────────────────────────── */
.feed { max-height: 268px; overflow-y: auto; }
.feed .ev {
  display: flex; align-items: baseline; gap: 12px;
  padding: 8px 16px; border-bottom: 1px solid var(--line-soft);
}
.feed .ev:last-child { border-bottom: 0; }
.feed .t { font: 400 12px/1 var(--font-mono); color: var(--subtle); min-width: 40px; }
.feed .who { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.feed .txt { font-size: 13.5px; color: var(--muted); }
.feed .ev.made .txt { color: var(--foreground); }
.feed .ev.made .pt { color: var(--signal); font-family: var(--font-mono); }
.feed .empty { padding: 16px; color: var(--subtle); font-size: 13.5px; }
.feed::-webkit-scrollbar { width: 8px; }
.feed::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* ── Source picker ───────────────────────────────────────────────────────── */
.sources { display: flex; gap: 8px; padding: 10px 16px 0; }
.sources button {
  border: 1px solid var(--line); background: transparent; color: var(--subtle);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
  font: 500 11px/1 var(--font-mono); letter-spacing: .06em;
  transition: color .15s var(--ease), border-color .15s var(--ease);
}
.sources button:hover { color: var(--muted); border-color: var(--line-soft); }
.sources button.on { color: var(--signal); border-color: var(--signal-line); }

/* Says what the numbers are worth, next to the numbers. */
.caveat {
  margin: 0; padding: 8px 16px 0;
  font: 400 11px/1.5 var(--font-mono); color: var(--subtle);
}

footer { padding: 0 32px 32px; max-width: var(--shell); margin: 0 auto; }
footer p { margin: 0; font: 400 12px/1.6 var(--font-mono); color: var(--subtle); }
</style>
</head>
<body>

<header><div class="bar">
  <a class="wordmark" href="index.html" title="Back to courtvision.io">
    <span class="name">court<b>vision</b></span>
    <span class="tag">AI</span>
  </a>
  <span class="live"><i></i>Playback</span>

  <div class="scoreboard">
    <div class="side home"><span class="label">Home</span><span class="num" id="scoreHome">0</span></div>
    <div class="sep"></div>
    <div class="side away"><span class="num" id="scoreAway">0</span><span class="label">Away</span></div>
    <div class="sep"></div>
    <span class="clock" id="clock">00:00</span>
  </div>
</div></header>

<main>
  <div class="row-top">
    <section class="panel">
      <div class="head"><span class="label">Footage</span><span class="right" id="srcNote"></span></div>
      <div class="sources" id="sourcePicker"></div>
      <div class="stage">
        <video id="game" muted playsinline loop controls preload="auto"></video>
        <div class="placeholder" id="placeholder">
          <div class="big">No footage loaded</div>
          <div class="label">see the README for how to produce one</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="head"><span class="label">Court</span><span class="right" id="shotNote">0 shots</span></div>
      <p class="caveat">positions accurate to about 20cm · labels are track ids, not jersey numbers</p>
      <canvas id="court" width="1160" height="660"></canvas>
    </section>
  </div>

  <div class="row-bottom">
    <section class="panel">
      <div class="head"><span class="label">Box score</span><span class="right" id="boxNote">events tagged by hand</span></div>
      <div class="body">
        <table>
          <thead><tr><th>Player</th><th>PTS</th><th>FG</th><th>3P</th><th>REB</th><th>AST</th><th>TO</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="head"><span class="label">Play by play</span></div>
      <div class="feed" id="feed"><div class="empty">waiting for tip-off…</div></div>
    </section>
  </div>
</main>

<footer><p id="status">loading…</p></footer>

<script src="assets/court.js"></script>
<script>
const TEAM = { home: '#c8f031', away: '#3bc9a8' };

/* Two clips, because the interesting thing is the difference between them.
   The first calibrates itself; on the second the same code cannot, and that
   gap is the whole point rather than an embarrassment to hide. */
const SOURCES = [
  { id:'nba',  label:'NBA Summer League final', video:'media/nba.mp4',  data:'data/nba.json',
    note:'court solved per frame by a keypoint model — no human input',
    game:{ home:'Grizzlies', away:'Warriors',
           title:'GSW 94–90 MEM · Las Vegas · 19 Jul 2026' } },
  { id:'bigv', label:'Big V community',   video:'media/game.mp4', data:'data/sample.json',
    note:'same code, court calibrated by hand — the model finds nothing here' },
];

let DATA = null;
let SOURCE = SOURCES[0];
let video = null;
let clockStart = null;   // silent fallback when there is no footage

init();

async function init(){
  buildSourcePicker();
  await load(SOURCES[0]);
}

async function load(src){
  SOURCE = src;
  DATA = null;
  try {
    const res = await fetch(src.data);
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch {
    status(`no data for ${src.label} — see the README for the pipeline commands`);
    return;
  }
  const gaps = DATA.frames.length && DATA.video.duration
    ? Math.max(0, Math.round(DATA.video.duration * (DATA.video.hz || 5)) - DATA.frames.length)
    : 0;
  // Which cluster is which club comes from the shirt colours, so it is a label
  // on the colour split, not an identification of anybody.
  document.querySelector('.scoreboard .home .label').textContent = src.game?.home ?? 'Home';
  document.querySelector('.scoreboard .away .label').textContent = src.game?.away ?? 'Away';
  status((src.game ? src.game.title + ' · ' : '') + `${DATA.source} · ${DATA.frames.length} tracked frames`
    + (gaps ? `, ${gaps} with no court in view` : '')
    + ` · ${DATA.events.length} events · ${src.note}`);
  mountVideo();
  drawCourt(0);
  render(0);
  requestAnimationFrame(tick);
}

function buildSourcePicker(){
  const host = document.getElementById('sourcePicker');
  if (!host) return;
  host.innerHTML = SOURCES.map((s, i) =>
    `<button data-src="${s.id}" class="${i === 0 ? 'on' : ''}">${s.label}</button>`).join('');
  host.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    [...host.children].forEach(c => c.classList.toggle('on', c === b));
    load(SOURCES.find(s => s.id === b.dataset.src));
  });
}

/* Play the clip straight away. If there is no file, fall back to an internal
   clock without showing any chrome — the demo always has something moving. */
function mountVideo(){
  const el = document.getElementById('game');
  // Switching clips re-enters this, so the handlers go on once rather than
  // stacking up another copy on every switch.
  if (!el.dataset.wired) {
    el.dataset.wired = '1';
    el.addEventListener('loadeddata', () => {
      video = el;
      clockStart = null;
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('srcNote').textContent = SOURCE.video;
      el.play().catch(() => {});
    });
    el.addEventListener('error', startClock);
  }
  video = null;
  clockStart = null;
  el.src = SOURCE.video;
  // Some browsers never fire error for a missing file behind a static server.
  // Wait for the transfer to actually be idle before deciding it is missing —
  // a big clip on a cold cache is slow, not absent.
  setTimeout(() => {
    if (!video && el.networkState !== HTMLMediaElement.NETWORK_LOADING) startClock();
  }, 2500);
}

function startClock(){
  if (clockStart || video) return;
  clockStart = performance.now();
  document.getElementById('srcNote').textContent = 'clock';
}

function currentTime(){
  if (video) return video.currentTime;
  if (clockStart) return ((performance.now() - clockStart) / 1000) % DATA.video.duration;
  return 0;
}

function tick(){
  if (DATA) { const t = currentTime(); drawCourt(t); render(t); }
  requestAnimationFrame(tick);
}

/* ── stats: everything that has happened up to t ──────────────────────────── */
function statsAt(t){
  const per = new Map();
  for (const p of DATA.players) per.set(p.id, { p, pts:0, fgm:0, fga:0, tpm:0, tpa:0, reb:0, ast:0, to:0 });
  let home = 0, away = 0;
  const shots = [];

  for (const e of DATA.events) {
    if (e.t > t) break;
    const s = per.get(e.player);
    if (!s) continue;
    if (e.type === 'shot_made' || e.type === 'shot_missed') {
      const made = e.type === 'shot_made';
      s.fga++; if (made) s.fgm++;
      if (e.points === 3) { s.tpa++; if (made) s.tpm++; }
      if (made) { s.pts += e.points; e.team === 'home' ? home += e.points : away += e.points; }
      shots.push(e);
    }
    else if (e.type === 'rebound')  s.reb++;
    else if (e.type === 'assist')   s.ast++;
    else if (e.type === 'turnover') s.to++;
  }
  return { per, home, away, shots };
}

function render(t){
  const { per, home, away, shots } = statsAt(t);
  document.getElementById('clock').textContent = fmt(t);
  document.getElementById('scoreHome').textContent = home;
  document.getElementById('scoreAway').textContent = away;
  document.getElementById('shotNote').textContent = `${shots.length} shot${shots.length === 1 ? '' : 's'}`;

  const rows = [...per.values()].sort((a,b) => b.pts - a.pts || b.reb - a.reb || a.p.id - b.p.id);
  document.getElementById('rows').innerHTML = rows.map(s => `
    <tr>
      <td class="name"><span class="jersey" style="background:${TEAM[s.p.team]}">${s.p.number}</span>${s.p.team === 'home' ? (SOURCE.game?.home ?? 'Home') : (SOURCE.game?.away ?? 'Away')}</td>
      <td class="pts" data-numeric>${s.pts}</td>
      <td data-numeric>${s.fgm}/${s.fga}</td>
      <td data-numeric>${s.tpm}/${s.tpa}</td>
      <td data-numeric>${s.reb}</td>
      <td data-numeric>${s.ast}</td>
      <td data-numeric>${s.to}</td>
    </tr>`).join('');

  const recent = DATA.events.filter(e => e.t <= t).slice(-40).reverse();
  const feed = document.getElementById('feed');
  feed.innerHTML = recent.length ? recent.map(e => {
    const p = DATA.players.find(x => x.id === e.player);
    const made = e.type === 'shot_made';
    const txt = {
      shot_made:   `#${p.number} scored <span class="pt">+${e.points}</span>`,
      shot_missed: `#${p.number} missed ${e.points}`,
      rebound:     `#${p.number} rebound`,
      assist:      `#${p.number} assist`,
      turnover:    `#${p.number} turnover`,
    }[e.type] || e.type;
    return `<div class="ev ${made ? 'made' : ''}">
      <span class="t">${fmt(e.t)}</span>
      <span class="who" style="background:${TEAM[p.team]}"></span>
      <span class="txt">${txt}</span>
    </div>`;
  }).join('') : '<div class="empty">waiting for tip-off…</div>';
}

/* ── top-down court ──────────────────────────────────────────────────────── */
function drawCourt(t){
  const cv = document.getElementById('court');
  const surface = Court.fit(cv);
  if (!surface) return;
  const { ctx, w: cw, h: ch } = surface;

  const L = DATA ? DATA.court.length_m : 28;
  const W = DATA ? DATA.court.width_m : 15;
  const g = Court.geometry(cw, ch, L, W);
  const { X, Y } = g;

  ctx.clearRect(0, 0, cw, ch);
  Court.lines(ctx, g, { w: cw, h: ch });

  if (!DATA) return;
  const { shots } = statsAt(t);

  for (const e of shots) {
    const made = e.type === 'shot_made';
    ctx.beginPath();
    ctx.arc(X(e.x), Y(e.y), 5.5, 0, Math.PI*2);
    ctx.globalAlpha = made ? .9 : .5;
    if (made) { ctx.fillStyle = TEAM[e.team]; ctx.fill(); }
    else { ctx.lineWidth = 1.5; ctx.strokeStyle = TEAM[e.team]; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  const frame = frameAt(t);
  if (!frame) {
    ctx.fillStyle = 'rgba(200,215,225,.55)';
    ctx.font = "500 13px 'JetBrains Mono', ui-monospace, monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('no court in view — replay or close-up', cw / 2, ch / 2);
    return;
  }
  for (const pos of frame.positions) {
    const p = DATA.players.find(x => x.id === pos.id);
    ctx.beginPath();
    ctx.arc(X(pos.x), Y(pos.y), 12, 0, Math.PI*2);
    ctx.fillStyle = TEAM[p.team];
    ctx.fill();
    ctx.fillStyle = '#08090c';
    ctx.font = "500 11px 'JetBrains Mono', ui-monospace, monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // A track id. Reading the actual number off a shirt is OCR, which is not
    // attempted here, so this must not be dressed up to look like one.
    ctx.fillText(String(p.number).replace(/^T/, ''), X(pos.x), Y(pos.y) + 0.5);
  }
}

/* Look the frame up by time, not by index. Broadcast footage drops out -- a
   replay, a bench shot, a moment with too little floor in view -- so the tracked
   frames are not a uniform grid. Indexing by t*hz assumes they are, and the
   court would drift steadily out of step with the video, which is the one thing
   this view exists to show. Returns null when the nearest tracked frame is too
   far away, so the court can say so rather than draw a stale position. */
function frameAt(t){
  const f = DATA.frames;
  if (!f.length) return null;
  let lo = 0, hi = f.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (f[mid].t < t) lo = mid + 1; else hi = mid;
  }
  const near = [f[lo], f[Math.max(0, lo - 1)]]
    .reduce((a, b) => Math.abs(a.t - t) <= Math.abs(b.t - t) ? a : b);
  const step = 1 / (DATA.video.hz || 5);
  return Math.abs(near.t - t) <= step * 1.5 ? near : null;
}
function fmt(t){
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function status(msg){ document.getElementById('status').textContent = msg; }
</script>
</body>
</html>
