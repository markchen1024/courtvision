<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>courtvision</title>
<style>
  :root {
    --bg: #0d1014;
    --panel: #161b22;
    --line: #262d36;
    --text: #e6edf3;
    --dim: #7d8894;
    --home: #f0883e;
    --away: #4c9be8;
    --good: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  header .tag { color: var(--dim); font-size: 12px; }
  header .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim); }

  main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 24px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 {
    margin: 0; padding: 10px 14px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--line);
  }
  .card .body { padding: 12px 14px; }

  video { width: 100%; display: block; background: #000; aspect-ratio: 16/9; }
  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; aspect-ratio: 16/9; color: var(--dim); text-align: center; padding: 20px;
  }
  .drop input { color: var(--dim); }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: #3d444d; }

  canvas { width: 100%; display: block; }

  .score { display: flex; align-items: center; gap: 16px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .score .side { display: flex; align-items: baseline; gap: 8px; }
  .score .num { font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .score .lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 6px; text-align: right; }
  th { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr { border-top: 1px solid var(--line); }
  td.pts { font-weight: 600; }
  .num-badge {
    display: inline-block; min-width: 22px; padding: 1px 5px; margin-right: 8px;
    border-radius: 4px; text-align: center; font-size: 11px; font-weight: 600; color: #0d1014;
  }

  .feed { max-height: 190px; overflow: auto; }
  .feed div { display: flex; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line); }
  .feed div:first-child { border-top: 0; }
  .feed .t { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 46px; }
  .feed .made { color: var(--good); }

  footer { padding: 4px 24px 28px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>courtvision</h1>
  <span class="tag">footage in, stat line out</span>
  <span class="clock" id="clock">00:00</span>
</header>

<main>
  <section class="card">
    <h2>Footage</h2>
    <div id="videoWrap">
      <div class="drop" id="drop">
        <div>Drop a game video here, or pick one</div>
        <input type="file" id="file" accept="video/*">
        <button id="useClock">No video — run on the clock</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Court</h2>
    <canvas id="court" width="1120" height="640"></canvas>
  </section>

  <section class="card">
    <h2>Box score</h2>
    <div class="score">
      <div class="side"><span class="dot" style="background:var(--home)"></span><span class="lbl">Home</span><span class="num" id="scoreHome">0</span></div>
      <div class="side"><span class="num" id="scoreAway">0</span><span class="lbl">Away</span><span class="dot" style="background:var(--away)"></span></div>
    </div>
    <div class="body">
      <table>
        <thead><tr><th>Player</th><th>PTS</th><th>FG</th><th>3P</th><th>REB</th><th>AST</th><th>TO</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Play by play</h2>
    <div class="body feed" id="feed"></div>
  </section>
</main>

<footer id="status">loading…</footer>

<script>
const COLOURS = { home: getCss('--home'), away: getCss('--away') };
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

let DATA = null;
let video = null;
let clockStart = null;   // fallback when there is no video
let clockRunning = false;

init();

async function init(){
  try {
    const res = await fetch('data/sample.json');
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch (e) {
    status(`could not load data/sample.json — run: python pipeline/make_sample_data.py`);
    return;
  }
  status(`${DATA.source} data · ${DATA.frames.length} frames · ${DATA.events.length} events`);
  drawCourt(0);
  render(0);
  requestAnimationFrame(tick);
}

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) mountVideo(URL.createObjectURL(f));
});
document.getElementById('useClock').addEventListener('click', () => {
  clockStart = performance.now();
  clockRunning = true;
  document.getElementById('drop').innerHTML = '<div>Running on the clock — no footage loaded</div>';
});

function mountVideo(src){
  const wrap = document.getElementById('videoWrap');
  wrap.innerHTML = '';
  video = document.createElement('video');
  video.src = src;
  video.controls = true;
  video.playsInline = true;
  wrap.appendChild(video);
}

function currentTime(){
  if (video) return video.currentTime;
  if (clockRunning) {
    const t = (performance.now() - clockStart) / 1000;
    return t % DATA.video.duration;
  }
  return 0;
}

function tick(){
  if (DATA) {
    const t = currentTime();
    drawCourt(t);
    render(t);
  }
  requestAnimationFrame(tick);
}

/* ---------- stats: everything that has happened up to t ---------- */

function statsAt(t){
  const per = new Map();
  for (const p of DATA.players) {
    per.set(p.id, { p, pts:0, fgm:0, fga:0, tpm:0, tpa:0, reb:0, ast:0, to:0 });
  }
  let home = 0, away = 0;
  const shots = [];

  for (const e of DATA.events) {
    if (e.t > t) break;
    const s = per.get(e.player);
    if (!s) continue;
    switch (e.type) {
      case 'shot_made':
      case 'shot_missed': {
        const made = e.type === 'shot_made';
        s.fga++; if (made) s.fgm++;
        if (e.points === 3) { s.tpa++; if (made) s.tpm++; }
        if (made) {
          s.pts += e.points;
          if (e.team === 'home') home += e.points; else away += e.points;
        }
        shots.push(e);
        break;
      }
      case 'rebound':  s.reb++; break;
      case 'assist':   s.ast++; break;
      case 'turnover': s.to++;  break;
    }
  }
  return { per, home, away, shots };
}

function render(t){
  const { per, home, away } = statsAt(t);
  document.getElementById('clock').textContent = fmt(t);
  document.getElementById('scoreHome').textContent = home;
  document.getElementById('scoreAway').textContent = away;

  const rows = [...per.values()]
    .sort((a,b) => b.pts - a.pts || b.reb - a.reb || a.p.number - b.p.number);

  document.getElementById('rows').innerHTML = rows.map(s => `
    <tr>
      <td><span class="num-badge" style="background:${COLOURS[s.p.team]}">${s.p.number}</span>${s.p.team === 'home' ? 'Home' : 'Away'}</td>
      <td class="pts">${s.pts}</td>
      <td>${s.fgm}/${s.fga}</td>
      <td>${s.tpm}/${s.tpa}</td>
      <td>${s.reb}</td>
      <td>${s.ast}</td>
      <td>${s.to}</td>
    </tr>`).join('');

  const recent = DATA.events.filter(e => e.t <= t).slice(-40).reverse();
  document.getElementById('feed').innerHTML = recent.map(e => {
    const p = DATA.players.find(x => x.id === e.player);
    const made = e.type === 'shot_made';
    const label = {
      shot_made:   `#${p.number} scored ${e.points}`,
      shot_missed: `#${p.number} missed ${e.points}`,
      rebound:     `#${p.number} rebound`,
      assist:      `#${p.number} assist`,
      turnover:    `#${p.number} turnover`,
    }[e.type] || e.type;
    return `<div><span class="t">${fmt(e.t)}</span><span class="${made?'made':''}">${label}</span></div>`;
  }).join('');
}

/* ---------- top-down court ---------- */

function drawCourt(t){
  const cv = document.getElementById('court');
  const ctx = cv.getContext('2d');
  const L = DATA ? DATA.court.length_m : 28;
  const W = DATA ? DATA.court.width_m : 15;
  const pad = 26;
  const s = Math.min((cv.width - pad*2) / L, (cv.height - pad*2) / W);
  const X = m => pad + m * s;
  const Y = m => pad + m * s;

  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#11161d';
  ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = '#39414d';
  ctx.lineWidth = 2;
  ctx.strokeRect(X(0), Y(0), L*s, W*s);

  // halfway line + centre circle
  ctx.beginPath();
  ctx.moveTo(X(L/2), Y(0)); ctx.lineTo(X(L/2), Y(W));
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(X(L/2), Y(W/2), 1.8*s, 0, Math.PI*2);
  ctx.stroke();

  for (const left of [true, false]) {
    const bx = left ? 1.575 : L - 1.575;      // basket centre
    const dir = left ? 1 : -1;
    // key
    ctx.strokeRect(X(left ? 0 : L - 5.8), Y(W/2 - 2.45), 5.8*s, 4.9*s);
    // free-throw circle
    ctx.beginPath();
    ctx.arc(X(left ? 5.8 : L - 5.8), Y(W/2), 1.8*s, 0, Math.PI*2);
    ctx.stroke();
    // three point arc + corners.
    // `a` is the angle off the centre line at which the 6.75 m arc meets the
    // corner line 0.9 m in from the sideline — asin, not acos.
    const a = Math.asin((W/2 - 0.9) / 6.75);
    ctx.beginPath();
    ctx.arc(X(bx), Y(W/2), 6.75*s, left ? -a : Math.PI - a, left ? a : Math.PI + a);
    ctx.stroke();
    const cx = bx + dir * 6.75 * Math.cos(a);
    ctx.beginPath();
    ctx.moveTo(X(left ? 0 : L), Y(0.9));      ctx.lineTo(X(cx), Y(0.9));
    ctx.moveTo(X(left ? 0 : L), Y(W - 0.9));  ctx.lineTo(X(cx), Y(W - 0.9));
    ctx.stroke();
    // hoop
    ctx.beginPath();
    ctx.arc(X(bx), Y(W/2), 0.225*s, 0, Math.PI*2);
    ctx.strokeStyle = '#5b6673'; ctx.stroke(); ctx.strokeStyle = '#39414d';
  }

  if (!DATA) return;

  // shot markers accumulate as the game goes
  const { shots } = statsAt(t);
  for (const e of shots) {
    const made = e.type === 'shot_made';
    ctx.beginPath();
    ctx.arc(X(e.x), Y(e.y), 5, 0, Math.PI*2);
    if (made) { ctx.fillStyle = COLOURS[e.team]; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1; }
    else { ctx.strokeStyle = COLOURS[e.team]; ctx.globalAlpha = 0.45; ctx.stroke(); ctx.globalAlpha = 1; ctx.strokeStyle = '#39414d'; }
  }

  // players at time t
  const frame = frameAt(t);
  if (!frame) return;
  for (const pos of frame.positions) {
    const p = DATA.players.find(x => x.id === pos.id);
    ctx.beginPath();
    ctx.arc(X(pos.x), Y(pos.y), 11, 0, Math.PI*2);
    ctx.fillStyle = COLOURS[p.team];
    ctx.fill();
    ctx.fillStyle = '#0d1014';
    ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.number, X(pos.x), Y(pos.y) + 0.5);
  }
}

function frameAt(t){
  const hz = DATA.video.hz || 5;
  const i = Math.max(0, Math.min(Math.round(t * hz), DATA.frames.length - 1));
  return DATA.frames[i];
}

function fmt(t){
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function status(msg){ document.getElementById('status').textContent = msg; }
</script>
</body>
</html>
