<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>courtvision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Tokens — "Blueprint". Near-black with a cool cast, hairlines instead of
   shadows, one acid-lime signal colour, mono for anything the machine produced.
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --void: #08090c;
  --surface: #0e1015;
  --surface-raised: #151920;
  --surface-inset: #050608;

  --line: #23272f;
  --line-soft: #161a20;
  --line-strong: #333a45;

  --foreground: #eef1f5;
  --muted: #99a2af;
  --subtle: #6a7383;
  --inverse: #08090c;

  --signal: #c8f031;          /* home — the only chromatic accent */
  --signal-line: #3e4d12;
  --teal: #3bc9a8;            /* away — status teal, never confused with signal */

  --radius-sm: .5rem;
  --radius-md: .75rem;
  --radius-lg: 1rem;

  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-sans: 'Inter', ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --ease: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; }

html { color-scheme: dark; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--void);
  color: var(--foreground);
  font: 400 15px/1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  position: relative;
  isolation: isolate;
}

/* The blueprint grid: fine minor rule with a heavier major every fourth
   division, masked so it fades out. Stops large black areas from reading as a
   rendering failure. */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(to right,  rgb(200 240 49 / .05) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(200 240 49 / .05) 1px, transparent 1px),
    linear-gradient(to right,  rgb(255 255 255 / .022) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(255 255 255 / .022) 1px, transparent 1px);
  background-size: 128px 128px, 128px 128px, 32px 32px, 32px 32px;
  mask-image: radial-gradient(ellipse 85% 65% at 50% 0%, #000 45%, transparent 100%);
}

::selection { background: var(--signal); color: var(--inverse); }

[data-numeric] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.label {
  font: 500 11px/1.4 var(--font-mono);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--subtle);
}

/* ── Header ──────────────────────────────────────────────────────────────── */
header { border-bottom: 1px solid var(--line-soft); }
header .bar {
  display: flex; align-items: center; gap: 20px;
  max-width: 1600px; margin: 0 auto;
  padding: 20px 32px;
}

/* Boxed wordmark. A plain text wordmark on black reads as a blog; a bordered
   one reads as equipment. */
.wordmark {
  display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 7px 11px;
}
.wordmark .name {
  font: 500 19px/1 var(--font-display);
  letter-spacing: -.02em;
}
.wordmark .name b { font-weight: 500; color: var(--signal); }
.wordmark .tag {
  border-left: 1px solid var(--line-strong); padding-left: 9px;
  font: 500 11px/1 var(--font-mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--subtle);
}

.live {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--signal-line); border-radius: 999px;
  padding: 4px 11px 4px 9px;
  font: 500 11px/1 var(--font-mono); letter-spacing: .16em;
  text-transform: uppercase; color: var(--signal);
}
.live i {
  width: 6px; height: 6px; border-radius: 50%; background: var(--signal);
  animation: pulse 2s var(--ease) infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

.scoreboard { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.scoreboard .side { display: flex; align-items: center; gap: 9px; }
.scoreboard .num { font: 500 30px/1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.scoreboard .home .num { color: var(--signal); }
.scoreboard .away .num { color: var(--teal); }
.scoreboard .sep { width: 1px; height: 26px; background: var(--line); }
.scoreboard .clock { font: 400 13px/1 var(--font-mono); color: var(--subtle); min-width: 44px; text-align: right; }

/* ── Layout ──────────────────────────────────────────────────────────────── */
main { padding: 24px 32px 40px; display: grid; gap: 20px; max-width: 1600px; margin: 0 auto; }
.row-top { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
.row-bottom { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; }
@media (max-width: 1080px) { .row-top, .row-bottom { grid-template-columns: 1fr; } }

.panel {
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.panel > .head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.panel > .head .right { margin-left: auto; font: 400 12px/1 var(--font-mono); color: var(--subtle); }
.panel > .body { padding: 14px 16px; }

/* ── Footage ─────────────────────────────────────────────────────────────── */
.stage { position: relative; background: var(--surface-inset); aspect-ratio: 16/9; }
.stage video { width: 100%; height: 100%; display: block; object-fit: cover; }
.stage .placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--subtle); text-align: center;
}
.stage .placeholder .big { font: 500 15px/1.4 var(--font-display); color: var(--muted); }

/* ── Court ───────────────────────────────────────────────────────────────── */
/* Fills whatever height the row ends up at, so it never leaves a dead band
   under the drawing when the footage panel is taller. */
canvas { flex: 1; min-height: 320px; width: 100%; display: block; background: var(--surface-inset); }

/* ── Box score ───────────────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 8px; text-align: right; }
th {
  font: 500 10px/1.4 var(--font-mono); letter-spacing: .12em;
  text-transform: uppercase; color: var(--subtle);
  border-bottom: 1px solid var(--line);
}
th:first-child, td:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid var(--line-soft); }
tbody tr:last-child { border-bottom: 0; }
td { font: 400 13px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
td.name { font-family: var(--font-sans); color: var(--foreground); }
td.pts { color: var(--foreground); font-weight: 500; }
.jersey {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 20px; padding: 0 5px; margin-right: 10px;
  border-radius: 4px; font: 500 11px/1 var(--font-mono); color: var(--inverse);
}

/* ── Play by play ────────────────────────────────────────────────────────── */
.feed { max-height: 268px; overflow-y: auto; }
.feed .ev {
  display: flex; align-items: baseline; gap: 12px;
  padding: 8px 16px; border-bottom: 1px solid var(--line-soft);
}
.feed .ev:last-child { border-bottom: 0; }
.feed .t { font: 400 12px/1 var(--font-mono); color: var(--subtle); min-width: 40px; }
.feed .who { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.feed .txt { font-size: 13.5px; color: var(--muted); }
.feed .ev.made .txt { color: var(--foreground); }
.feed .ev.made .pt { color: var(--signal); font-family: var(--font-mono); }
.feed .empty { padding: 16px; color: var(--subtle); font-size: 13.5px; }
.feed::-webkit-scrollbar { width: 8px; }
.feed::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

footer { padding: 0 32px 32px; max-width: 1600px; margin: 0 auto; }
footer p { margin: 0; font: 400 12px/1.6 var(--font-mono); color: var(--subtle); }
</style>
</head>
<body>

<header><div class="bar">
  <span class="wordmark">
    <span class="name">court<b>vision</b></span>
    <span class="tag">CV</span>
  </span>
  <span class="live"><i></i>Live</span>

  <div class="scoreboard">
    <div class="side home"><span class="label">Home</span><span class="num" id="scoreHome">0</span></div>
    <div class="sep"></div>
    <div class="side away"><span class="num" id="scoreAway">0</span><span class="label">Away</span></div>
    <div class="sep"></div>
    <span class="clock" id="clock">00:00</span>
  </div>
</div></header>

<main>
  <div class="row-top">
    <section class="panel">
      <div class="head"><span class="label">Footage</span><span class="right" id="srcNote"></span></div>
      <div class="stage">
        <video id="game" muted playsinline loop preload="auto"></video>
        <div class="placeholder" id="placeholder">
          <div class="big">No footage loaded</div>
          <div class="label">drop a clip at web/media/game.mp4</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="head"><span class="label">Court</span><span class="right" id="shotNote">0 shots</span></div>
      <canvas id="court" width="1160" height="660"></canvas>
    </section>
  </div>

  <div class="row-bottom">
    <section class="panel">
      <div class="head"><span class="label">Box score</span><span class="right">generated, not typed</span></div>
      <div class="body">
        <table>
          <thead><tr><th>Player</th><th>PTS</th><th>FG</th><th>3P</th><th>REB</th><th>AST</th><th>TO</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="head"><span class="label">Play by play</span></div>
      <div class="feed" id="feed"><div class="empty">waiting for tip-off…</div></div>
    </section>
  </div>
</main>

<footer><p id="status">loading…</p></footer>

<script>
const TEAM = { home: '#c8f031', away: '#3bc9a8' };
const VIDEO_SRC = 'media/game.mp4';

let DATA = null;
let video = null;
let clockStart = null;   // silent fallback when there is no footage

init();

async function init(){
  try {
    const res = await fetch('data/sample.json');
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch {
    status('no data — run: python pipeline/make_sample_data.py');
    return;
  }
  status(`${DATA.source} tracking · ${DATA.frames.length} frames · ${DATA.events.length} events · court ${DATA.court.length_m}×${DATA.court.width_m}m`);
  mountVideo();
  drawCourt(0);
  render(0);
  requestAnimationFrame(tick);
}

/* Play the clip straight away. If there is no file, fall back to an internal
   clock without showing any chrome — the demo always has something moving. */
function mountVideo(){
  const el = document.getElementById('game');
  el.addEventListener('loadeddata', () => {
    video = el;
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('srcNote').textContent = VIDEO_SRC;
    el.play().catch(() => {});
  });
  el.addEventListener('error', startClock);
  el.src = VIDEO_SRC;
  // some browsers never fire error for a missing file behind a static server
  setTimeout(() => { if (!video) startClock(); }, 1200);
}

function startClock(){
  if (clockStart || video) return;
  clockStart = performance.now();
  document.getElementById('srcNote').textContent = 'clock';
}

function currentTime(){
  if (video) return video.currentTime;
  if (clockStart) return ((performance.now() - clockStart) / 1000) % DATA.video.duration;
  return 0;
}

function tick(){
  if (DATA) { const t = currentTime(); drawCourt(t); render(t); }
  requestAnimationFrame(tick);
}

/* ── stats: everything that has happened up to t ──────────────────────────── */
function statsAt(t){
  const per = new Map();
  for (const p of DATA.players) per.set(p.id, { p, pts:0, fgm:0, fga:0, tpm:0, tpa:0, reb:0, ast:0, to:0 });
  let home = 0, away = 0;
  const shots = [];

  for (const e of DATA.events) {
    if (e.t > t) break;
    const s = per.get(e.player);
    if (!s) continue;
    if (e.type === 'shot_made' || e.type === 'shot_missed') {
      const made = e.type === 'shot_made';
      s.fga++; if (made) s.fgm++;
      if (e.points === 3) { s.tpa++; if (made) s.tpm++; }
      if (made) { s.pts += e.points; e.team === 'home' ? home += e.points : away += e.points; }
      shots.push(e);
    }
    else if (e.type === 'rebound')  s.reb++;
    else if (e.type === 'assist')   s.ast++;
    else if (e.type === 'turnover') s.to++;
  }
  return { per, home, away, shots };
}

function render(t){
  const { per, home, away, shots } = statsAt(t);
  document.getElementById('clock').textContent = fmt(t);
  document.getElementById('scoreHome').textContent = home;
  document.getElementById('scoreAway').textContent = away;
  document.getElementById('shotNote').textContent = `${shots.length} shot${shots.length === 1 ? '' : 's'}`;

  const rows = [...per.values()].sort((a,b) => b.pts - a.pts || b.reb - a.reb || a.p.number - b.p.number);
  document.getElementById('rows').innerHTML = rows.map(s => `
    <tr>
      <td class="name"><span class="jersey" style="background:${TEAM[s.p.team]}">${s.p.number}</span>${s.p.team === 'home' ? 'Home' : 'Away'}</td>
      <td class="pts" data-numeric>${s.pts}</td>
      <td data-numeric>${s.fgm}/${s.fga}</td>
      <td data-numeric>${s.tpm}/${s.tpa}</td>
      <td data-numeric>${s.reb}</td>
      <td data-numeric>${s.ast}</td>
      <td data-numeric>${s.to}</td>
    </tr>`).join('');

  const recent = DATA.events.filter(e => e.t <= t).slice(-40).reverse();
  const feed = document.getElementById('feed');
  feed.innerHTML = recent.length ? recent.map(e => {
    const p = DATA.players.find(x => x.id === e.player);
    const made = e.type === 'shot_made';
    const txt = {
      shot_made:   `#${p.number} scored <span class="pt">+${e.points}</span>`,
      shot_missed: `#${p.number} missed ${e.points}`,
      rebound:     `#${p.number} rebound`,
      assist:      `#${p.number} assist`,
      turnover:    `#${p.number} turnover`,
    }[e.type] || e.type;
    return `<div class="ev ${made ? 'made' : ''}">
      <span class="t">${fmt(e.t)}</span>
      <span class="who" style="background:${TEAM[p.team]}"></span>
      <span class="txt">${txt}</span>
    </div>`;
  }).join('') : '<div class="empty">waiting for tip-off…</div>';
}

/* ── top-down court ──────────────────────────────────────────────────────── */
function drawCourt(t){
  const cv = document.getElementById('court');
  const ctx = cv.getContext('2d');

  // Match the backing store to the laid-out size (and to the device pixel
  // ratio) so the court stays sharp and never stretches.
  const dpr = window.devicePixelRatio || 1;
  const cw = cv.clientWidth, ch = cv.clientHeight;
  const w = Math.round(cw * dpr), h = Math.round(ch * dpr);
  if (!w || !h) return;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  // Draw in CSS pixels from here on; the transform handles the retina scale.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const L = DATA ? DATA.court.length_m : 28;
  const W = DATA ? DATA.court.width_m : 15;
  const pad = 26;
  const s = Math.min((cw - pad*2) / L, (ch - pad*2) / W);
  const ox = (cw - L*s) / 2, oy = (ch - W*s) / 2;
  const X = m => ox + m * s;
  const Y = m => oy + m * s;

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#050608';
  ctx.fillRect(0, 0, cw, ch);

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#333a45';
  ctx.strokeRect(X(0), Y(0), L*s, W*s);

  ctx.strokeStyle = '#23272f';
  ctx.beginPath(); ctx.moveTo(X(L/2), Y(0)); ctx.lineTo(X(L/2), Y(W)); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(L/2), Y(W/2), 1.8*s, 0, Math.PI*2); ctx.stroke();

  for (const left of [true, false]) {
    const bx = left ? 1.575 : L - 1.575;          // basket centre
    const dir = left ? 1 : -1;
    ctx.strokeRect(X(left ? 0 : L - 5.8), Y(W/2 - 2.45), 5.8*s, 4.9*s);
    ctx.beginPath(); ctx.arc(X(left ? 5.8 : L - 5.8), Y(W/2), 1.8*s, 0, Math.PI*2); ctx.stroke();

    // `a` is the angle at which the 6.75 m arc meets the corner line 0.9 m in
    // from the sideline — asin, not acos.
    const a = Math.asin((W/2 - 0.9) / 6.75);
    ctx.beginPath();
    ctx.arc(X(bx), Y(W/2), 6.75*s, left ? -a : Math.PI - a, left ? a : Math.PI + a);
    ctx.stroke();
    const cx = bx + dir * 6.75 * Math.cos(a);
    ctx.beginPath();
    ctx.moveTo(X(left ? 0 : L), Y(0.9));     ctx.lineTo(X(cx), Y(0.9));
    ctx.moveTo(X(left ? 0 : L), Y(W - 0.9)); ctx.lineTo(X(cx), Y(W - 0.9));
    ctx.stroke();

    ctx.strokeStyle = '#4a525f';
    ctx.beginPath(); ctx.arc(X(bx), Y(W/2), 0.225*s, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#23272f';
  }

  if (!DATA) return;
  const { shots } = statsAt(t);

  for (const e of shots) {
    const made = e.type === 'shot_made';
    ctx.beginPath();
    ctx.arc(X(e.x), Y(e.y), 5.5, 0, Math.PI*2);
    ctx.globalAlpha = made ? .9 : .5;
    if (made) { ctx.fillStyle = TEAM[e.team]; ctx.fill(); }
    else { ctx.lineWidth = 1.5; ctx.strokeStyle = TEAM[e.team]; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  const frame = frameAt(t);
  if (!frame) return;
  for (const pos of frame.positions) {
    const p = DATA.players.find(x => x.id === pos.id);
    ctx.beginPath();
    ctx.arc(X(pos.x), Y(pos.y), 12, 0, Math.PI*2);
    ctx.fillStyle = TEAM[p.team];
    ctx.fill();
    ctx.fillStyle = '#08090c';
    ctx.font = "500 11px 'JetBrains Mono', ui-monospace, monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.number, X(pos.x), Y(pos.y) + 0.5);
  }
}

function frameAt(t){
  const hz = DATA.video.hz || 5;
  return DATA.frames[Math.max(0, Math.min(Math.round(t * hz), DATA.frames.length - 1))];
}
function fmt(t){
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function status(msg){ document.getElementById('status').textContent = msg; }
</script>
</body>
</html>
